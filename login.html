<!DOCTYPE html>
<html lang="en">
<head>

  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TITLE -->
  <title>Login | Ashrya</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
  />

  <style>

    /* ===================================
       GLOBAL RESET
    =================================== */

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }

    /* ===================================
       BODY
    =================================== */

    body{

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: white;

      padding: 20px;
    }

    /* ===================================
       LOGIN CONTAINER
    =================================== */

    .login-container{

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===================================
       LOGIN BOX
    =================================== */

    .login-box{

      width: 100%;
      max-width: 420px;

      background-color: white;

      border-radius: 25px;

      padding: 2.5rem;

      border-top: 8px solid #f2545b;

      box-shadow: 0px 4px 20px rgba(0,0,0,0.15);

      animation: popup 0.5s ease;
    }

    @keyframes popup{

      from{
        opacity: 0;
        transform: translateY(30px);
      }

      to{
        opacity: 1;
        transform: translateY(0px);
      }
    }

    /* ===================================
       LOGO
    =================================== */

    .logo{

      text-align: center;

      margin-bottom: 1rem;
    }

    .logo img{

      width: 150px;
    }

    /* ===================================
       HEADING
    =================================== */

    .login-box h1{

      text-align: center;

      color: #f2545b;

      margin-bottom: 2rem;

      font-size: 2.2rem;
    }

    /* ===================================
       FORM
    =================================== */

    .login-form{

      display: flex;
      flex-direction: column;

      gap: 1rem;
    }

    /* ===================================
       INPUT BOXES
    =================================== */

    .login-form input{

      height: 52px;

      border: 2px solid transparent;

      outline: none;

      border-radius: 50px;

      padding: 0px 20px;

      background-color: rgb(255, 188, 222);

      font-size: 1rem;

      transition: 0.3s;
    }

    .login-form input:focus{

      border: 2px solid #8a4fff;

      background-color: rgb(255, 214, 235);
    }

    .login-form input::placeholder{

      color: white;

      font-weight: bold;
    }

    /* ===================================
       FORGOT PASSWORD
    =================================== */

    .forgot-password{

      text-align: right;

      margin-top: -5px;
    }

    .forgot-password a{

      text-decoration: none;

      color: #f2545b;

      font-size: 0.95rem;

      font-weight: bold;
    }

    .forgot-password a:hover{

      color: #8a4fff;
    }

    /* ===================================
       LOGIN BUTTON
    =================================== */

    .login-btn{

      height: 52px;

      border: none;

      border-radius: 50px;

      background-color: #f2545b;

      color: white;

      font-size: 1.1rem;

      font-weight: bold;

      cursor: pointer;

      transition: 0.4s;
    }

    .login-btn:hover{

      background-color: rgb(201, 92, 251);

      transform: scale(1.03);
    }

    /* ===================================
       EXTRA TEXT
    =================================== */

    .login-extra{

      margin-top: 1.2rem;

      text-align: center;

      font-size: 0.95rem;
    }

    .login-extra a{

      text-decoration: none;

      color: #f2545b;

      font-weight: bold;
    }

    .login-extra a:hover{

      color: #8a4fff;

      text-decoration: underline;
    }

    /* ===================================
       RESPONSIVE
    =================================== */

    @media(max-width:500px){

      .login-box{

        padding: 2rem 1.5rem;
      }

      .login-box h1{

        font-size: 1.8rem;
      }
    }

  </style>

</head>

<body>

  <!-- ===================================
       LOGIN PAGE
  =================================== -->

  <div class="login-container">

    <div class="login-box">

      <!-- LOGO -->

      <div class="logo">

        <img
          src="images/Logo.png"
          alt="Ashrya Logo"
        >

      </div>

      <!-- HEADING -->

      <h1>

        <i class="fa-solid fa-right-to-bracket"></i>

        Welcome Back

      </h1>

      <!-- FORM -->

      <form class="login-form">

        <!-- EMAIL -->

        <input
          type="email"
          placeholder="Enter Your Email"
          required
        >

        <!-- PASSWORD -->

        <input
          type="password"
          placeholder="Enter Your Password"
          required
        >

        <!-- FORGOT PASSWORD -->

        <div class="forgot-password">

          <a href="#">

            Forgot Password ?

          </a>

        </div>

        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="login-btn"
        >

          <i class="fa-solid fa-arrow-right"></i>

          Login Now

        </button>

      </form>

      <!-- REGISTER LINK -->

      <div class="login-extra">

        Don't have an account ?

        <a href="signup2.html">

          Register Here

        </a>

      </div>

    </div>

  </div>

</body>
</html>
